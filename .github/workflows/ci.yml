name: Starter checks
on:
  pull_request:
concurrency:
  group: starter-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/audit.py
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: python3 tools/package.py
  wordpress:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '7.0'
            php: '8.3'
          - wp: '7.1.2'
            php: '8.3'
          - wp: '7.1.2'
            php: '8.5'
          - wp: '7.1.2'
            php: '8.3'
            woo: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:wordpress
        env:
          GCS_BROWSER_TESTS: '1'
          GCS_WOO_TESTS: ${{ matrix.woo || '0' }}
          GCS_WP_VERSION: ${{ matrix.wp }}
          GCS_PHP_VERSION: ${{ matrix.php }}
  multisite:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run test:multisite
      - run: npm run test:network-scale
      - run: npm run test:minimum
  presentation:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [accessibility-review, locale-rtl, editor-upgrade]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: python3 tools/package.py
      - run: node tests/${{ matrix.suite }}.mjs
  commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:commerce-playground
