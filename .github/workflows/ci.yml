name: Starter checks
on:
  pull_request:
  push:
    branches: ['hermes/**']
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/audit.py
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: python3 tools/package.py
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '7.0'
            php: '8.3'
          - wp: '7.1.2'
            php: '8.3'
          - wp: '7.1.2'
            php: '8.5'
          - wp: '7.1.2'
            php: '8.3'
            woo: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:wordpress
        env:
          GCS_BROWSER_TESTS: '1'
          GCS_WOO_TESTS: ${{ matrix.woo || '0' }}
          GCS_WP_VERSION: ${{ matrix.wp }}
          GCS_PHP_VERSION: ${{ matrix.php }}
